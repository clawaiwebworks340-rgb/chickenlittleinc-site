<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You — Chicken Little Services Inc.</title>
  <link rel="icon" href="images/logo-trans.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, #16161a 0%, #0a0a0a 70%);
      color: #f5f5f2;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 520px; }
    .card img { width: 110px; margin-bottom: 24px; }
    h1 { font-size: 40px; margin-bottom: 14px; }
    p { color: #a0a0a8; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
    a.btn {
      display: inline-block; padding: 14px 32px; border-radius: 100px;
      background: #d4af37; color: #15100a; text-decoration: none;
      font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/logo-trans.png" alt="Chicken Little Services Inc">
    <h1>Got it. We'll be in touch.</h1>
    <p>Your submission went through — a real person (not a bot) reviews every message. Estimates and urgent requests get a reply within one business day, usually faster.</p>
    <a class="btn" href="/">&larr; Back to the site</a>
  </div>
</body>
</html>
